# =============================================================================
# MLIS Test Automation — Consolidated Pipeline
# Covers: Sanity (12) | Regression (19) | BDX (6) test scenarios
#
# Pipeline secret variables required (set in Azure DevOps UI):
#
#   UAT2 environment:
#     MLIS_PORTAL_URL              SALESFORCE_LIGHTNING_URL
#     BROKER_USERNAME              BROKER_PASSWORD
#     SALESFORCE_USERNAME          SALESFORCE_PASSWORD
#
#   SIT2 environment (SIT2_* prefix):
#     SIT2_MLIS_PORTAL_URL         SIT2_SALESFORCE_LIGHTNING_URL
#     SIT2_BROKER_USERNAME         SIT2_BROKER_PASSWORD
#     SIT2_SALESFORCE_USERNAME     SIT2_SALESFORCE_PASSWORD
# =============================================================================

# ---------------------------------------------------------------------------
# CI Triggers
# ---------------------------------------------------------------------------
trigger:
  branches:
    include:
      - main
      - master
      - develop
  paths:
    include:
      - tests/**
      - src/**
      - playwright.config.ts
      - package.json

pr:
  branches:
    include:
      - main
      - master
      - develop

# ---------------------------------------------------------------------------
# Runtime Parameters
# ---------------------------------------------------------------------------
parameters:
  - name: testEnv
    displayName: 'Target Environment'
    type: string
    default: 'UAT2'
    values:
      - UAT2
      - SIT2

  - name: testSuite
    displayName: 'Test Suite'
    type: string
    default: 'all'
    values:
      - all
      - sanity
      - regression
      - bdx

  - name: browser
    displayName: 'Browser'
    type: string
    default: 'chrome'
    values:
      - chrome
      - chromium
      - msedge

# ---------------------------------------------------------------------------
# Global Variables
# ---------------------------------------------------------------------------
variables:
  nodeVersion: '18.x'
  CI: 'true'
  TEST_ENV: ${{ parameters.testEnv }}
  BROWSER: ${{ parameters.browser }}

# ===========================================================================
# YAML Anchors — shared step blocks (DRY)
# ===========================================================================

# Reusable: Node install + npm cache + npm ci + Playwright browser install
.install: &install
  - task: NodeTool@0
    displayName: 'Install Node.js $(nodeVersion)'
    inputs:
      versionSpec: $(nodeVersion)

  - task: Cache@2
    displayName: 'Cache npm dependencies'
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      path: '$(System.DefaultWorkingDirectory)/node_modules'
      restoreKeys: |
        npm | "$(Agent.OS)"

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install --with-deps $(BROWSER)
    displayName: 'Install Playwright browser — $(BROWSER)'

# Reusable: environment variable block passed to every test script step
.env: &env
  CI: $(CI)
  TEST_ENV: $(TEST_ENV)
  # UAT2 credentials
  MLIS_PORTAL_URL: $(MLIS_PORTAL_URL)
  SALESFORCE_LIGHTNING_URL: $(SALESFORCE_LIGHTNING_URL)
  BROKER_USERNAME: $(BROKER_USERNAME)
  BROKER_PASSWORD: $(BROKER_PASSWORD)
  SALESFORCE_USERNAME: $(SALESFORCE_USERNAME)
  SALESFORCE_PASSWORD: $(SALESFORCE_PASSWORD)
  # SIT2 credentials
  SIT2_MLIS_PORTAL_URL: $(SIT2_MLIS_PORTAL_URL)
  SIT2_SALESFORCE_LIGHTNING_URL: $(SIT2_SALESFORCE_LIGHTNING_URL)
  SIT2_BROKER_USERNAME: $(SIT2_BROKER_USERNAME)
  SIT2_BROKER_PASSWORD: $(SIT2_BROKER_PASSWORD)
  SIT2_SALESFORCE_USERNAME: $(SIT2_SALESFORCE_USERNAME)
  SIT2_SALESFORCE_PASSWORD: $(SIT2_SALESFORCE_PASSWORD)

# ===========================================================================
# STAGES
# ===========================================================================
stages:

  # =========================================================================
  # STAGE 1 — SANITY TESTS  (12 test cases)
  # =========================================================================
  - stage: Sanity_Tests
    displayName: 'Stage 1 — Sanity Tests (12 tests)'
    condition: |
      or(
        eq('${{ parameters.testSuite }}', 'sanity'),
        eq('${{ parameters.testSuite }}', 'all')
      )
    jobs:
      - job: RunSanity
        displayName: 'Sanity — $(TEST_ENV) / $(BROWSER)'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 60
        steps:
          - *install

          # ----------------------------------------------------------------
          # Sanity test cases:
          #   TC_SAN_001  Commercial EW — multiple products
          #   TC_SAN_002  Commercial EW — multiple products via referral
          #   TC_SAN_003  Commercial EW — single product
          #   TC_SAN_004  Commercial EW — single product via referral
          #   TC_SAN_005  Full commercial EW quote journey
          #   TC_SAN_006  Full residential EW quote journey
          #   TC_SAN_007  Residential EW — multiple products quote journey
          #   TC_SAN_008  Cancel from inception — full premium return
          #   TC_SAN_009  Residential quick quote — single product email
          #   TC_SAN_010  Residential quick quote — multiple products email
          #   TC_SAN_011  Residential quick quote Scotland — single product manual
          #   TC_SAN_012  Residential quick quote Scotland — multiple products manual
          # ----------------------------------------------------------------
          - script: >
              npx playwright test tests/sanity/
              --project=$(BROWSER)
              --workers=1
              --reporter=list,html
            displayName: 'Run Sanity tests (TC_SAN_001 – TC_SAN_012)'
            env:
              <<: *env

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Sanity HTML report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'sanity-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Sanity test results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'sanity-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

  # =========================================================================
  # STAGE 2 — REGRESSION TESTS  (19 test cases)
  # =========================================================================
  - stage: Regression_Tests
    displayName: 'Stage 2 — Regression Tests (19 tests)'
    dependsOn: Sanity_Tests
    condition: |
      and(
        succeededOrFailed(),
        or(
          eq('${{ parameters.testSuite }}', 'regression'),
          eq('${{ parameters.testSuite }}', 'all')
        )
      )
    jobs:
      - job: RunRegression
        displayName: 'Regression — $(TEST_ENV) / $(BROWSER)'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 150
        steps:
          - *install

          # ----------------------------------------------------------------
          # Regression test cases:
          #   TC_REG_001  Commercial NI — multiple products
          #   TC_REG_002  Commercial NI — single product
          #   TC_REG_003  Commercial Scotland — multiple products
          #   TC_REG_004  Commercial Scotland — single product
          #   TC_REG_005  Residential EW — multiple products
          #   TC_REG_006  Residential EW — single product
          #   TC_REG_007  Residential NI — multiple products
          #   TC_REG_008  Residential NI — single product
          #   TC_REG_009  Residential Scotland — multiple products
          #   TC_REG_010  Residential Scotland — single product
          #   TC_REG_011  Notes & Attachments — Salesforce EW policy
          #   TC_REG_012  Notes & Attachments — Salesforce commercial EW
          #   TC_REG_013  Notes & Attachments — Salesforce commercial Scotland
          #   TC_REG_014  MTA mid-term adjustment
          #   TC_REG_015  Cancel and reissue live policy
          #   TC_REG_016  MTA then cancel policy
          #   TC_REG_017  MTA then cancel and reissue
          #   TC_REG_018  MTA then cancel and reissue then cancel policy
          #   TC_REG_019  Cancel and reissue then cancel policy
          # ----------------------------------------------------------------
          - script: >
              npx playwright test tests/regression/
              --project=$(BROWSER)
              --workers=1
              --reporter=list,html
            displayName: 'Run Regression tests (TC_REG_001 – TC_REG_019)'
            env:
              <<: *env

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Regression HTML report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'regression-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Regression test results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'regression-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

  # =========================================================================
  # STAGE 3 — BDX TESTS  (6 test cases)
  # =========================================================================
  - stage: BDX_Tests
    displayName: 'Stage 3 — BDX Tests (6 tests)'
    dependsOn: Regression_Tests
    condition: |
      and(
        succeededOrFailed(),
        or(
          eq('${{ parameters.testSuite }}', 'bdx'),
          eq('${{ parameters.testSuite }}', 'all')
        )
      )
    jobs:

      # ----------------------------------------------------------------------
      # JOB A — BDX Core (TC_BDX_001 runs alone; 002-004 run in parallel job)
      # ----------------------------------------------------------------------

      - job: BDX_001
        displayName: 'TC_BDX_001 — INTRO Cancel Full Premium Return'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 30
        steps:
          - *install

          - script: >
              npx playwright test
              tests/BDX/TC_BDX_001_INTRO_cancel_full_premium_return.spec.ts
              --project=$(BROWSER)
              --workers=1
              --reporter=list,html
            displayName: 'Run TC_BDX_001'
            env:
              <<: *env

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_001 report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'bdx-001-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_001 results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'bdx-001-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

      - job: BDX_002_003_004
        displayName: 'TC_BDX_002-004 — INTER / BDE / NO-COMM Policy BDX Lines'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 60
        steps:
          - *install

          # TC_BDX_002  INTER COMM — policy BDX lines
          # TC_BDX_003  BDE  COMM  — policy BDX lines
          # TC_BDX_004  NO   COMM  — policy BDX lines
          - script: |
              npx playwright test \
                tests/BDX/TC_BDX_002_INTER_COMM_policy_bdx_lines.spec.ts \
                tests/BDX/TC_BDX_003_BDE_COMM_policy_bdx_lines.spec.ts \
                tests/BDX/TC_BDX_004_NO_COMM_policy_bdx_lines.spec.ts \
                --project=$(BROWSER) \
                --workers=1 \
                --reporter=list,html
            displayName: 'Run TC_BDX_002 / 003 / 004'
            env:
              <<: *env

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_002-004 report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'bdx-002-004-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_002-004 results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'bdx-002-004-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

      # ----------------------------------------------------------------------
      # JOB B — BDX Advanced (TC_BDX_005 & 006 — run in parallel)
      # ----------------------------------------------------------------------

      - job: BDX_005
        displayName: 'TC_BDX_005 — NB MTA Cancellation Mid-Term Adjustment'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 30
        steps:
          - *install

          - script: >
              npx playwright test
              tests/BDX/TC_BDX_005_NB_MTA_Cancellation_mid_term_adjustment.spec.ts
              --project=$(BROWSER)
              --workers=1
              --reporter=list,html
            displayName: 'Run TC_BDX_005'
            env:
              <<: *env

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_005 report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'bdx-005-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_005 results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'bdx-005-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

      - job: BDX_006
        displayName: 'TC_BDX_006 — BDE Cancel & Reissue Then Cancel Policy'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 30
        steps:
          - *install

          - script: >
              npx playwright test
              tests/BDX/TC_BDX_006_BDE_new_cancel_and_reissue_then_cancel_policy.spec.ts
              --project=$(BROWSER)
              --workers=1
              --reporter=list,html
            displayName: 'Run TC_BDX_006'
            env:
              <<: *env

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_006 report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'bdx-006-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_006 results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'bdx-006-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

  # =========================================================================
  # STAGE 4 — PUBLISH CONSOLIDATED RESULTS
  # =========================================================================
  - stage: Publish_Results
    displayName: 'Stage 4 — Publish Consolidated Results'
    dependsOn:
      - Sanity_Tests
      - Regression_Tests
      - BDX_Tests
    condition: always()
    jobs:
      - job: ConsolidateResults
        displayName: 'Consolidate Results & Summary'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download all artifacts'
            inputs:
              buildType: current
              targetPath: '$(Pipeline.Workspace)/artifacts'

          - script: |
              echo "============================================"
              echo "  MLIS Test Automation — Pipeline Summary"
              echo "============================================"
              echo "  Environment : $(TEST_ENV)"
              echo "  Browser     : $(BROWSER)"
              echo "  Suite       : ${{ parameters.testSuite }}"
              echo "============================================"
              echo ""
              echo "  Stages executed:"
              echo "    Stage 1 — Sanity     : TC_SAN_001 – TC_SAN_012  (12 tests)"
              echo "    Stage 2 — Regression : TC_REG_001 – TC_REG_019  (19 tests)"
              echo "    Stage 3 — BDX        : TC_BDX_001 – TC_BDX_006  ( 6 tests)"
              echo "                           ─────────────────────────────────────"
              echo "                           Total                      37 tests"
              echo "============================================"
            displayName: 'Display run summary'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Dashboard report'
            condition: always()
            inputs:
              targetPath: 'reports/dashboard'
              artifact: 'test-dashboard-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline
