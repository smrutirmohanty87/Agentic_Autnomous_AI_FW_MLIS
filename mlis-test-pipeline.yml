# =============================================================================
# MLIS Test Automation — Consolidated Tag-Based Pipeline
# Covers: Sanity (12) | Regression (19) | BDX (6) test scenarios
#
# Tests are selected using Playwright's --grep flag with tags defined
# directly inside each test file's test.describe() block:
#
#   @sanity     → tests/sanity/TC_SAN_001 – TC_SAN_012
#   @regression → tests/regression/TC_REG_001 – TC_REG_019
#   @bdx        → tests/BDX/TC_BDX_001 – TC_BDX_006
#                 (BDX tests use @sanity tag + "BDX" in describe name;
#                  matched via --grep "@sanity" scoped to tests/BDX/)
#
# Equivalent local commands:
#   npx playwright test --grep "@sanity"     tests/sanity/
#   npx playwright test --grep "@regression" tests/regression/
#   npx playwright test --grep "@sanity"     tests/BDX/
#
# Pipeline secret variables required (set in Azure DevOps UI):
#
#   UAT2 environment:
#     MLIS_PORTAL_URL              SALESFORCE_LIGHTNING_URL
#     BROKER_USERNAME              BROKER_PASSWORD
#     SALESFORCE_USERNAME          SALESFORCE_PASSWORD
#
#   SIT2 environment (SIT2_* prefix):
#     SIT2_MLIS_PORTAL_URL         SIT2_SALESFORCE_LIGHTNING_URL
#     SIT2_BROKER_USERNAME         SIT2_BROKER_PASSWORD
#     SIT2_SALESFORCE_USERNAME     SIT2_SALESFORCE_PASSWORD
#
#   DURQA environment (DURQA_* prefix):
#     DURQA_MLIS_PORTAL_URL        DURQA_SALESFORCE_LIGHTNING_URL
#     DURQA_BROKER_USERNAME        DURQA_BROKER_PASSWORD
#     DURQA_SALESFORCE_USERNAME    DURQA_SALESFORCE_PASSWORD
# =============================================================================

# ---------------------------------------------------------------------------
# CI Triggers
# ---------------------------------------------------------------------------
trigger:
  branches:
    include:
      - main
      - master
      - develop
  paths:
    include:
      - tests/**
      - src/**
      - playwright.config.ts
      - package.json

pr:
  branches:
    include:
      - main
      - master
      - develop

# ---------------------------------------------------------------------------
# Runtime Parameters
# ---------------------------------------------------------------------------
parameters:
  - name: testEnv
    displayName: 'Target Environment'
    type: string
    default: 'UAT2'
    values:
      - UAT2
      - SIT2
      - DURQA

  # Select tests by the @tag used in test.describe() blocks.
  # @sanity     → runs TC_SAN_001–012  (tests/sanity/)
  # @regression → runs TC_REG_001–019  (tests/regression/)
  # @bdx        → runs TC_BDX_001–006  (tests/BDX/)
  # all         → runs every suite in sequence
  - name: tag
    displayName: 'Test Tag (suite selector)'
    type: string
    default: 'all'
    values:
      - all
      - '@sanity'
      - '@regression'
      - '@bdx'

  - name: browser
    displayName: 'Browser'
    type: string
    default: 'chrome'
    values:
      - chrome
      - chromium
      - msedge

# ---------------------------------------------------------------------------
# Global Variables
# ---------------------------------------------------------------------------
variables:
  nodeVersion: '18.x'
  CI: 'true'
  TEST_ENV: ${{ parameters.testEnv }}
  BROWSER: ${{ parameters.browser }}
  SELECTED_TAG: ${{ parameters.tag }}

# ===========================================================================
# YAML Anchors — shared step blocks (DRY)
# ===========================================================================

# Reusable: Node install + npm cache + npm ci + Playwright browser install
.install: &install
  - task: NodeTool@0
    displayName: 'Install Node.js $(nodeVersion)'
    inputs:
      versionSpec: $(nodeVersion)

  - task: Cache@2
    displayName: 'Cache npm dependencies'
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      path: '$(System.DefaultWorkingDirectory)/node_modules'
      restoreKeys: |
        npm | "$(Agent.OS)"

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install --with-deps $(BROWSER)
    displayName: 'Install Playwright browser — $(BROWSER)'

# Reusable: environment variable block passed to every test script step
.env: &env
  CI: $(CI)
  TEST_ENV: $(TEST_ENV)
  # UAT2 credentials
  MLIS_PORTAL_URL: $(MLIS_PORTAL_URL)
  SALESFORCE_LIGHTNING_URL: $(SALESFORCE_LIGHTNING_URL)
  BROKER_USERNAME: $(BROKER_USERNAME)
  BROKER_PASSWORD: $(BROKER_PASSWORD)
  SALESFORCE_USERNAME: $(SALESFORCE_USERNAME)
  SALESFORCE_PASSWORD: $(SALESFORCE_PASSWORD)
  # SIT2 credentials
  SIT2_MLIS_PORTAL_URL: $(SIT2_MLIS_PORTAL_URL)
  SIT2_SALESFORCE_LIGHTNING_URL: $(SIT2_SALESFORCE_LIGHTNING_URL)
  SIT2_BROKER_USERNAME: $(SIT2_BROKER_USERNAME)
  SIT2_BROKER_PASSWORD: $(SIT2_BROKER_PASSWORD)
  SIT2_SALESFORCE_USERNAME: $(SIT2_SALESFORCE_USERNAME)
  SIT2_SALESFORCE_PASSWORD: $(SIT2_SALESFORCE_PASSWORD)
  # DURQA credentials
  DURQA_MLIS_PORTAL_URL: $(DURQA_MLIS_PORTAL_URL)
  DURQA_SALESFORCE_LIGHTNING_URL: $(DURQA_SALESFORCE_LIGHTNING_URL)
  DURQA_BROKER_USERNAME: $(DURQA_BROKER_USERNAME)
  DURQA_BROKER_PASSWORD: $(DURQA_BROKER_PASSWORD)
  DURQA_SALESFORCE_USERNAME: $(DURQA_SALESFORCE_USERNAME)
  DURQA_SALESFORCE_PASSWORD: $(DURQA_SALESFORCE_PASSWORD)

# ===========================================================================
# STAGES
# ===========================================================================
stages:

  # =========================================================================
  # STAGE 1 — SANITY TESTS  (12 test cases)
  # Tag filter: --grep "@sanity"  scoped to tests/sanity/
  # Triggered when tag == '@sanity' or tag == 'all'
  # =========================================================================
  - stage: Sanity_Tests
    displayName: 'Stage 1 — Sanity Tests [@sanity] (12 tests)'
    condition: |
      or(
        eq('${{ parameters.tag }}', '@sanity'),
        eq('${{ parameters.tag }}', 'all')
      )
    jobs:
      - job: RunSanity
        displayName: 'Sanity [@sanity] — $(TEST_ENV) / $(BROWSER)'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 60
        steps:
          - *install

          # ----------------------------------------------------------------
          # Tag:  @sanity
          # Grep: --grep "@sanity"  (matches test.describe blocks prefixed @sanity)
          # Scope: tests/sanity/  (excludes BDX which also uses @sanity)
          #
          # Test cases matched:
          #   TC_SAN_001  @sanity | E2E | Commercial | England & Wales
          #   TC_SAN_002  @sanity | E2E | Commercial | England & Wales
          #   TC_SAN_003  @sanity | E2E | Commercial | England & Wales
          #   TC_SAN_004  @sanity | E2E | Commercial | England & Wales
          #   TC_SAN_005  @sanity | E2E | Salesforce Quote Journey | Commercial E&W
          #   TC_SAN_006  @sanity | E2E | Salesforce Quote Journey | Residential E&W
          #   TC_SAN_007  @sanity | E2E | Salesforce Quote Journey | Residential E&W Multiple Products
          #   TC_SAN_008  @sanity | E2E | Cancellation | From Inception
          #   TC_SAN_009  @sanity | E2E | Residential Quick Quote | England & Wales
          #   TC_SAN_010  @sanity | E2E | Residential Quick Quote | England & Wales
          #   TC_SAN_011  @sanity | E2E | Residential Quick Quote | Scotland
          #   TC_SAN_012  @sanity | E2E | Residential Quick Quote | Scotland
          # ----------------------------------------------------------------
          - script: >
              npx playwright test tests/sanity/
              --grep "@sanity"
              --project=$(BROWSER)
              --workers=1
              --reporter=list,html
            displayName: 'Run Sanity tests —tag @sanity (TC_SAN_001–012)'
            env:
              <<: *env

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Sanity HTML report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'sanity-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Sanity test results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'sanity-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

  # =========================================================================
  # STAGE 2 — REGRESSION TESTS  (19 test cases)
  # Tag filter: --grep "@regression"  scoped to tests/regression/
  # Triggered when tag == '@regression' or tag == 'all'
  # =========================================================================
  - stage: Regression_Tests
    displayName: 'Stage 2 — Regression Tests [@regression] (19 tests)'
    dependsOn: Sanity_Tests
    condition: |
      and(
        succeededOrFailed(),
        or(
          eq('${{ parameters.tag }}', '@regression'),
          eq('${{ parameters.tag }}', 'all')
        )
      )
    jobs:
      - job: RunRegression
        displayName: 'Regression [@regression] — $(TEST_ENV) / $(BROWSER)'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 150
        steps:
          - *install

          # ----------------------------------------------------------------
          # Tag:  @regression
          # Grep: --grep "@regression"  (matches test.describe blocks prefixed @regression)
          # Scope: tests/regression/
          #
          # Test cases matched:
          #   TC_REG_001  @regression | E2E | Commercial | Northern Ireland
          #   TC_REG_002  @regression | E2E | Commercial | Northern Ireland
          #   TC_REG_003  @regression | E2E | Commercial | Scotland
          #   TC_REG_004  @regression | E2E | Commercial | Scotland
          #   TC_REG_005  @regression | E2E | Residential | England & Wales
          #   TC_REG_006  @regression | E2E | Residential | England & Wales
          #   TC_REG_007  @regression | E2E | Residential | Northern Ireland
          #   TC_REG_008  @regression | E2E | Residential | Northern Ireland
          #   TC_REG_009  @regression | E2E | Residential | Scotland
          #   TC_REG_010  @regression | E2E | Residential | Scotland
          #   TC_REG_011  @regression | E2E | Notes & Attachments | England & Wales
          #   TC_REG_012  @regression | E2E | Notes & Attachments | Commercial
          #   TC_REG_013  @regression | E2E | Notes & Attachments | Commercial Scotland
          #   TC_REG_014  @regression | E2E | MTA
          #   TC_REG_015  @regression | E2E | Cancel and Reissue
          #   TC_REG_016  @regression | E2E | MTA + Cancellation
          #   TC_REG_017  @regression | E2E | MTA + Cancel and Reissue
          #   TC_REG_018  @regression | E2E | MTA + Cancel and Reissue + Cancellation
          #   TC_REG_019  @regression | E2E | Cancel and Reissue + Cancellation
          # ----------------------------------------------------------------
          - script: >
              npx playwright test tests/regression/
              --grep "@regression"
              --project=$(BROWSER)
              --workers=1
              --reporter=list,html
            displayName: 'Run Regression tests — tag @regression (TC_REG_001–019)'
            env:
              <<: *env

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Regression HTML report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'regression-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Regression test results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'regression-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

  # =========================================================================
  # STAGE 3 — BDX TESTS  (6 test cases)
  # Tag filter: --grep "@sanity"  scoped to tests/BDX/
  #   (BDX specs use @sanity tag + "BDX" in their describe name;
  #    scoping to tests/BDX/ ensures sanity tests are not re-run)
  # Triggered when tag == '@bdx' or tag == 'all'
  # =========================================================================
  - stage: BDX_Tests
    displayName: 'Stage 3 — BDX Tests [@bdx] (6 tests)'
    dependsOn: Regression_Tests
    condition: |
      and(
        succeededOrFailed(),
        or(
          eq('${{ parameters.tag }}', '@bdx'),
          eq('${{ parameters.tag }}', 'all')
        )
      )
    jobs:

      # ----------------------------------------------------------------------
      # JOB A — BDX Core (TC_BDX_001 runs alone; 002-004 run in parallel job)
      # ----------------------------------------------------------------------

      - job: BDX_001
        displayName: 'TC_BDX_001 [@sanity|BDX] — INTRO Cancel Full Premium Return'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 30
        steps:
          - *install

          # Tag in spec: @sanity | E2E | BDX | Cancellation | From Inception
          - script: >
              npx playwright test
              tests/BDX/TC_BDX_001_INTRO_cancel_full_premium_return.spec.ts
              --grep "@sanity"
              --project=$(BROWSER)
              --workers=1
              --reporter=list,html
            displayName: 'Run TC_BDX_001 — tag @sanity (BDX scope)'
            env:
              <<: *env

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_001 report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'bdx-001-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_001 results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'bdx-001-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

      - job: BDX_002_003_004
        displayName: 'TC_BDX_002-004 [@sanity|BDX] — INTER / BDE / NO-COMM'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 60
        steps:
          - *install

          # Tags in specs:
          #   TC_BDX_002  @sanity | E2E | BDX | INTER_COMM
          #   TC_BDX_003  @sanity | E2E | BDX | BDE_COMM
          #   TC_BDX_004  @sanity | E2E | BDX | NO_COMM
          - script: |
              npx playwright test \
                tests/BDX/TC_BDX_002_INTER_COMM_policy_bdx_lines.spec.ts \
                tests/BDX/TC_BDX_003_BDE_COMM_policy_bdx_lines.spec.ts \
                tests/BDX/TC_BDX_004_NO_COMM_policy_bdx_lines.spec.ts \
                --grep "@sanity" \
                --project=$(BROWSER) \
                --workers=1 \
                --reporter=list,html
            displayName: 'Run TC_BDX_002/003/004 — tag @sanity (BDX scope)'
            env:
              <<: *env

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_002-004 report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'bdx-002-004-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_002-004 results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'bdx-002-004-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

      # ----------------------------------------------------------------------
      # JOB B — BDX Advanced (TC_BDX_005 & 006 — run in parallel)
      # ----------------------------------------------------------------------

      - job: BDX_005
        displayName: 'TC_BDX_005 [@sanity|BDX] — NB MTA Cancellation'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 30
        steps:
          - *install

          # Tag in spec: @sanity | E2E | BDX | NB_MTA
          - script: >
              npx playwright test
              tests/BDX/TC_BDX_005_NB_MTA_Cancellation_mid_term_adjustment.spec.ts
              --grep "@sanity"
              --project=$(BROWSER)
              --workers=1
              --reporter=list,html
            displayName: 'Run TC_BDX_005 — tag @sanity (BDX scope)'
            env:
              <<: *env

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_005 report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'bdx-005-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_005 results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'bdx-005-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

      - job: BDX_006
        displayName: 'TC_BDX_006 [@sanity|BDX] — BDE Cancel & Reissue Then Cancel'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 30
        steps:
          - *install

          # Tag in spec: @sanity | E2E | BDX | BDE | Cancel and Reissue | Cancellation
          - script: >
              npx playwright test
              tests/BDX/TC_BDX_006_BDE_new_cancel_and_reissue_then_cancel_policy.spec.ts
              --grep "@sanity"
              --project=$(BROWSER)
              --workers=1
              --reporter=list,html
            displayName: 'Run TC_BDX_006 — tag @sanity (BDX scope)'
            env:
              <<: *env

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_006 report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'bdx-006-report-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: 'Publish TC_BDX_006 results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'bdx-006-results-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline

  # =========================================================================
  # STAGE 4 — PUBLISH CONSOLIDATED RESULTS
  # =========================================================================
  - stage: Publish_Results
    displayName: 'Stage 4 — Publish Consolidated Results'
    dependsOn:
      - Sanity_Tests
      - Regression_Tests
      - BDX_Tests
    condition: always()
    jobs:
      - job: ConsolidateResults
        displayName: 'Consolidate Results & Summary'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download all artifacts'
            inputs:
              buildType: current
              targetPath: '$(Pipeline.Workspace)/artifacts'

          - script: |
              echo "============================================"
              echo "  MLIS Test Automation — Pipeline Summary"
              echo "============================================"
              echo "  Environment : $(TEST_ENV)"
              echo "  Browser     : $(BROWSER)"
              echo "  Tag filter  : $(SELECTED_TAG)"
              echo "============================================"
              echo ""
              echo "  Tag → Stage mapping:"
              echo "    @sanity     → Stage 1 — TC_SAN_001–012  (12 tests)"
              echo "    @regression → Stage 2 — TC_REG_001–019  (19 tests)"
              echo "    @bdx        → Stage 3 — TC_BDX_001–006  ( 6 tests)"
              echo "    all         → All stages (37 tests total)"
              echo "============================================"
              echo ""
              echo "  Equivalent local commands:"
              echo "    npx playwright test --grep \"@sanity\"     tests/sanity/"
              echo "    npx playwright test --grep \"@regression\" tests/regression/"
              echo "    npx playwright test --grep \"@sanity\"     tests/BDX/"
              echo "============================================"
            displayName: 'Display run summary'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Dashboard report'
            condition: always()
            inputs:
              targetPath: 'reports/dashboard'
              artifact: 'test-dashboard-$(TEST_ENV)-$(BROWSER)'
              publishLocation: pipeline
