name: Regression Tests
on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'tests/regression/**'
      - 'src/**'
      - 'playwright.config.ts'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'tests/regression/**'
      - 'src/**'
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chrome
          - chromium
          - edge

jobs:
  regression-chrome:
    name: Regression Tests - Chrome
    timeout-minutes: 120
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.browser == 'chrome' || github.event.inputs.browser == 'all' || github.event.inputs.browser == '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chrome
      
      - name: Run Regression tests - Chrome
        run: npm run test:regression:chrome
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: regression-results-chrome
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 30
      
      - name: Upload screenshots and videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-failures-chrome
          path: test-results/**/attachments/
          retention-days: 7

  regression-chromium:
    name: Regression Tests - Chromium
    timeout-minutes: 120
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.browser == 'chromium' || github.event.inputs.browser == 'all' || github.event.inputs.browser == '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run Regression tests - Chromium
        run: npm run test:regression:chromium
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: regression-results-chromium
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 30
      
      - name: Upload screenshots and videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-failures-chromium
          path: test-results/**/attachments/
          retention-days: 7

  regression-edge:
    name: Regression Tests - Microsoft Edge
    timeout-minutes: 120
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.browser == 'edge' || github.event.inputs.browser == 'all' || github.event.inputs.browser == '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps msedge
      
      - name: Run Regression tests - Edge
        run: npm run test:regression:edge
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: regression-results-edge
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 30
      
      - name: Upload screenshots and videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-failures-edge
          path: test-results/**/attachments/
          retention-days: 7

  report:
    name: Generate Regression Test Report
    runs-on: ubuntu-latest
    needs: [regression-chrome, regression-chromium, regression-edge]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      
      - name: Display structure of downloaded files
        run: ls -R all-artifacts
      
      - name: Publish test summary
        run: |
          echo "## Regression Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Chrome: ${{ needs.regression-chrome.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Chromium: ${{ needs.regression-chromium.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Edge: ${{ needs.regression-edge.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- Total Regression Tests: 18" >> $GITHUB_STEP_SUMMARY
          echo "- Execution Time: $(date)" >> $GITHUB_STEP_SUMMARY
