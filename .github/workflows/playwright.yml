name: Playwright Tests
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - sanity
          - regression
          - bdx

jobs:
  sanity:
    name: Sanity Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_suite == 'sanity' || github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == '' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, chromium]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Run Sanity tests
        run: npm run test:sanity:${{ matrix.browser }}
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sanity-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 30

  regression:
    name: Regression Tests
    timeout-minutes: 90
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_suite == 'regression' || github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == '' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, chromium]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Run Regression tests
        run: npm run test:regression:${{ matrix.browser }}
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: regression-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 30

  bdx:
    name: BDX Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_suite == 'bdx' || github.event.inputs.test_suite == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, chromium]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Run BDX tests
        run: npm run test:bdx:all
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bdx-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 30

  all-tests:
    name: All Tests
    timeout-minutes: 120
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Run all tests
        run: npx playwright test
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: all-tests-results
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 30
      
      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-dashboard
          path: reports/dashboard/
          retention-days: 30
